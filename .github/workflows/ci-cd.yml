name: Student Management CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-quality-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Build
        run: ./mvnw -B clean compile
      - name: Automated Testing and Coverage
        run: ./mvnw -B verify
      - name: Code Quality Check
        run: ./mvnw -B checkstyle:check
      - name: Package
        run: ./mvnw -B package -DskipTests
      - name: Deploy - Build Docker Image
        run: docker build -t student-management:${{ github.sha }} .
      - name: Deploy - Upload Artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: student-management-jar
          path: target/*.jar
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      # Next step: enable SonarCloud analysis after configuring SONAR_TOKEN and project settings.
      # - name: SonarCloud analysis
      #   run: ./mvnw -B sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
